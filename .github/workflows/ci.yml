name: CI

# Actions minutes are limited (private repo: macOS counts 10x, Windows 2x). A PR runs on Linux
# only, once per push; main and a manual run ("Run workflow", any branch) test all three systems.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # a newer push replaces a PR's running check
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung apt-get once held a runner for the 6 h default
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen  # the app's tests run without a screen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg ;;
            Linux)
              # a static build from GitHub: apt-get once took 18 min on a slow mirror
              curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
              tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
              ls -d "$RUNNER_TEMP"/ffmpeg-*/bin >> "$GITHUB_PATH"
              # Qt's runtime libraries for the app's tests: apt only if one is missing
              qt="libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0"  # pulse: QtMultimedia
              if ! dpkg -s $qt >/dev/null 2>&1; then
                sudo apt-get update -o Acquire::Retries=3
                timeout 600 sudo apt-get install -y --no-install-recommends $qt
              fi ;;
            Windows)
              curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
              unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP"
              cygpath -w "$(ls -d "$RUNNER_TEMP"/ffmpeg-*/bin)" >> "$GITHUB_PATH" ;;
          esac
      - run: uv sync --locked --extra gui
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
