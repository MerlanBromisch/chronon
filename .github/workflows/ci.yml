name: CI

# Actions minutes are limited (private repo: macOS counts 10x, Windows 2x). A PR runs on Linux
# only, once per push; main and a manual run ("Run workflow", any branch) test all three systems.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # a newer push replaces a PR's running check
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # a hung apt-get once held a runner for the 6 h default
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen  # the app's tests run without a screen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            macOS) brew install ffmpeg ;;
            Linux)
              sudo apt-get update
              # ffmpeg, and Qt's runtime libraries for the app's tests
              sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ;;
            Windows)
              curl -fsSL -o "$RUNNER_TEMP/ffmpeg.zip" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
              unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP"
              cygpath -w "$(ls -d "$RUNNER_TEMP"/ffmpeg-*/bin)" >> "$GITHUB_PATH" ;;
          esac
      - run: uv sync --locked --extra gui
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
