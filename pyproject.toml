[project]
name = "chronon"
version = "0.0.1"
description = "Automatic waveform-based sync for multi-device recordings, with clock drift correction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
chronon = "chronon.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
